<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>陪跑戰隊 · JEV 角色圖鑑</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft JhengHei",sans-serif;color:#e4ecf5;background:#081018;font-synthesis:none;color-scheme:dark}*{box-sizing:border-box}body{margin:0}a{color:#9fdaeb}button,select{font:inherit;color:inherit;background:#132534;border:1px solid #375064;border-radius:8px;padding:9px 13px}button{cursor:pointer}button:hover,select:hover{border-color:#9bcae3}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #8fe4dc;outline-offset:4px}header,main{max-width:1440px;margin:auto;padding:26px 32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #223544;gap:15px}.brand{font-size:12px;font-weight:750;letter-spacing:3px}.brand span{color:#75b8d0}.back{font-size:12px;text-decoration:none}.hero{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;margin:24px 0 26px}.eyebrow{font-size:11px;color:#7ea6bc;letter-spacing:3px}h1{font-size:clamp(31px,4vw,52px);line-height:1.1;margin:12px 0 15px;font-weight:650;letter-spacing:-1.5px}.intro{color:#9eb4c4;font-size:14px;line-height:1.8;max-width:700px;margin:0}.count{white-space:nowrap;border:1px solid #385163;padding:11px 15px;border-radius:8px;color:#9ed7c7;font-size:12px}.controls{position:sticky;top:0;z-index:3;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:16px;margin-bottom:22px;border:1px solid #2a4253;border-radius:12px;background:#0c1925f2;backdrop-filter:blur(15px)}label{display:flex;flex-direction:column;gap:7px;font-size:10px;color:#90aabb;letter-spacing:1px}select{min-width:120px;font-size:13px;letter-spacing:0}#play{align-self:flex-end;font-size:13px}.notice{margin-left:auto;font-size:11px;color:#8ca7b8;line-height:1.7;max-width:300px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{min-width:0;overflow:hidden;border:1px solid #2b4050;border-radius:14px;background:linear-gradient(145deg,#12212d,#0c161f);--tone:#86d7ed;box-shadow:0 12px 40px #0002}.card-top{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 0}.alias{font-size:11px;letter-spacing:2px;color:var(--tone);font-weight:750}.role{color:#8da6b7;font-size:10px}.stage{height:290px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 72%,color-mix(in srgb,var(--tone) 10%,transparent),transparent 63%);position:relative}.stage:after{content:'';position:absolute;bottom:27px;width:130px;height:12px;border:1px solid color-mix(in srgb,var(--tone) 26%,transparent);border-radius:50%;z-index:0}canvas{width:268px;height:268px;position:relative;z-index:1;object-fit:contain;max-width:100%;filter:drop-shadow(0 8px 12px #0005)}.info{padding:0 22px 21px}.info h2{margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:1px}.info p{margin:0;color:#91aabc;font-size:12px;line-height:1.8;min-height:43px}.state{margin:14px 0 13px;font-size:10px;color:var(--tone);display:flex;align-items:center;gap:7px}.state:before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor}.sheet{font-size:11px;color:#8da8ba}.sheet summary{cursor:pointer;min-height:24px}.sheet img{display:block;width:100%;height:auto;border-radius:7px;margin-top:10px;background:repeating-conic-gradient(#14242f 0 25%,#0b1720 0 50%) 0 0/20px 20px;border:1px solid #294351}.asset-link{display:inline-block;margin-top:8px;font-size:11px}.error{color:#f1ac98}.footer{padding:28px 0 12px;font-size:11px;color:#7894a7;line-height:1.8}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.notice{max-width:220px}.hero{align-items:flex-start}.count{font-size:10px}}@media(max-width:620px){header,main{padding:20px 16px}.brand{letter-spacing:1.5px}.hero{display:block;margin:18px 0}.count{display:inline-block;margin-top:15px}.controls{gap:9px;padding:12px}.controls label{flex:1 1 95px}.controls select{min-width:0;width:100%;font-size:12px}.notice{margin-left:0;max-width:none;width:100%;font-size:10px}.grid{grid-template-columns:1fr}.stage{height:300px}.intro{font-size:12px}.back{font-size:10px}.card-top{padding-top:17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="brand">JEV <span>COMPANIONS</span></div><a class="back" href="/stage.html">← 返回指揮舞台</a></header>
<main>
<div class="hero"><div><div class="eyebrow">ORIGINAL GAME ART · VOL. 01</div><h1>你的陪跑戰隊</h1><p class="intro">七個角色，各有自己的專長與裝備。完整繪製四個方向、巡線步態、工作姿態與四種表情，以透明 PNG 保留原畫細節。</p></div><div class="count" id="loadStatus" role="status">正在讀取原畫…</div></div>
<div class="controls" aria-label="角色素材預覽控制">
<label>動作<select id="mode"><option value="walk">巡線步態</option><option value="idle">待命</option><option value="work">工作姿態</option><option value="expression">表情</option></select></label>
<label>方向<select id="view"><option value="0">正面</option><option value="1">右側</option><option value="2">背面</option><option value="3">左側</option></select></label>
<label>表情<select id="emotion"><option value="0">開心</option><option value="1">專注</option><option value="2">擔心</option><option value="3">疲倦</option></select></label>
<button id="play" aria-pressed="true">暫停播放</button><div class="notice">這裡是動作素材預覽。工作姿態與表情不代表代理目前正在執行任務；即時狀態請看指揮舞台。</div>
</div>
<section class="grid" id="gallery" aria-label="七位陪跑夥伴"></section>
<div class="footer">每個角色 24 幅完整姿態：四方向 × 五排動作，加上四幅正面表情。所有動作直接裁切完整原畫格，沒有拼接肢體或以待命圖冒充工作狀態。透明區域不帶背景。</div>
</main>
<script src="preview.js"></script>
</body></html>
